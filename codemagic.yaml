workflows:
  android-debug:
    name: Android Debug Build
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web bundle
        script: node build-www.mjs
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  ios-debug:
    name: iOS Debug Build (Simulator)
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web bundle
        script: node build-www.mjs
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Build for simulator (no signing required)
        script: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            build

  # --- Release workflows (uncomment / fill in once you have store accounts) ---
  #
  # android-release:
  #   name: Android Release (Play Store)
  #   instance_type: linux_x2
